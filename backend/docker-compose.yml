name: asvs-backend

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-asvs}
      POSTGRES_USER: ${POSTGRES_USER:-asvs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-asvs} -d ${POSTGRES_DB:-asvs}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  liquibase:
    image: liquibase/liquibase:4.29
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./db/changelog:/liquibase/changelog
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-asvs}
      LIQUIBASE_COMMAND_USERNAME: ${POSTGRES_USER:-asvs}
      LIQUIBASE_COMMAND_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      LIQUIBASE_COMMAND_CHANGELOG_FILE: changelog/db.changelog-root.yaml
    command: update
    profiles:
      - migrate

volumes:
  postgres_data:
  redis_data:
